# 葉宸佑 鋼琴樂譜商店（跟 mozart-shop 分開）
# 部署步驟見 README.md。金鑰不要寫在這裡，用 `npx wrangler secret put` 設定。
name = "score-shop"
main = "src/index.js"
compatibility_date = "2026-10-01"

[vars]
# 測試時用 "stage"（綠界測試環境），全部試過沒問題再改成 "prod"
ECPAY_ENV = "prod"
SITE_URL = "https://chenyuyeh92.github.io/sheet-music/"
# 買家有問題時寫信的信箱
CONTACT_EMAIL = "chenyouye493@gmail.com"

[[kv_namespaces]]
binding = "ORDERS"
# 執行 `npx wrangler kv namespace create ORDERS` 後，把它給的 id 貼在這裡
id = "83cab26a190d429993204f036c6a1f89"

[[r2_buckets]]
binding = "SCORES"
bucket_name = "score-files"

[observability]
enabled = true
